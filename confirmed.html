<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تم تأكيد بريدك — ساحة 99</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #07090E; color: #E2E8F0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; min-height: 100vh; display: grid; place-items: center; }
  .card { max-width: 460px; padding: 40px 26px; text-align: center; }
  .logo { width: 92px; height: 92px; border-radius: 26px; background: #0F172A; border: 1px solid #22D3EE; color: #22D3EE; font: 900 42px "JetBrains Mono", monospace; display: grid; place-items: center; margin: 0 auto 20px; box-shadow: 0 0 40px rgba(34,211,238,.35); }
  .check { font-size: 46px; margin-bottom: 8px; }
  h1 { color: #10B981; font-size: 24px; margin: 0 0 10px; }
  p { color: #94A3B8; font-size: 15px; line-height: 1.9; }
  b { color: #E2E8F0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">99</div>
  <div class="check">✅</div>
  <h1>تم تأكيد بريدك بنجاح</h1>
  <p>حسابك في <b>ساحة 99</b> جاهز الآن.<br />
  ارجع إلى التطبيق واضغط <b>«عدت وفعّلت — سجّل الدخول»</b> ثم ادخل ببريدك وكلمة المرور.</p>
  <p style="margin-top:22px;font-size:13px;color:#64748B">يمكنك إغلاق هذه الصفحة.</p>
</div>
</body>
</html>
