    <script>
      // 2.2 themes: pick the palette BEFORE first paint (mirrors normalizePref/resolveTheme in

      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem('arena99.settings') || '{}').state || {}).theme;
          var old = { paper: 'light', pearl: 'light', calm: 'dark', neon: 'dark', graphite: 'dark', desert: 'dark' };
          t = old[t] || t;
          if (t !== 'light' && t !== 'dim' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var bg = { light: '#F5F3EE', dim: '#3B3936', dark: '#151413' }[t];
          document.documentElement.style.background = bg;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
