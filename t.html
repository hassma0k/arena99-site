<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="صديقك يتحداك في 5 أسئلة تحصيلي علمي: فيزياء، كيمياء، أحياء، رياضيات. نفس الأسئلة، ولكل سؤال شرح. مجاني.">
<meta name="theme-color" content="#F5F3EE">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ساحة 99">
<meta property="og:locale" content="ar_SA">
<meta property="og:title" content="تقدر تتفوّق علي؟ 5 أسئلة تحصيلي علمي — ساحة 99">
<meta property="og:description" content="نفس الأسئلة الخمسة، بدون مؤقّت، ولكل سؤال شرح. فيزياء · كيمياء · أحياء · رياضيات.">

<style>
:root{--bg:#F5F3EE;--panel:#FBFAF7;--line:#DDD8CE;--ink:#1C1917;--muted:#57534E;--teal:#0F766E;--on:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#151413;--panel:#1E1C1A;--line:#363330;--ink:#EAE6DF;--muted:#C9C3B9;--teal:#5BBDAD;--on:#151413}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Cairo,'Geeza Pro',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 16px}
main{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
.logo b{font:800 26px ui-monospace,Menlo,monospace;color:#fff;background:#0F766E;border-radius:12px;padding:2px 10px}
h1{font-size:27px;line-height:1.4;margin:4px 0 0}
p{color:var(--muted);margin:0;line-height:1.8;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;color:var(--muted)}
.b{display:block;width:100%;background:var(--teal);color:var(--on);font-weight:900;font-size:18px;text-decoration:none;border:0;border-radius:14px;padding:15px}
.g{background:transparent;color:var(--teal);border:1px solid var(--line);font-size:15px;padding:12px}
.s{color:var(--muted);font-size:12px;margin-top:8px;opacity:.8}
</style></head>
<body>
<main>
<div class="logo"><b>99</b>ساحة 99</div>
<h1 id="h">تقدر تتفوّق علي؟</h1>
<p id="p">5 أسئلة تحصيلي علمي، نفس الأسئلة التي حللتها.<br>بدون مؤقّت، ولكل سؤال شرح.</p>
<div class="chips" id="chips"></div>
<a class="b" id="open" href="#">عندي التطبيق — افتح التحدي</a>
<a class="b g" id="store" href="https://apps.apple.com/sa/app/id6809119944">ما عندك التطبيق؟ حمّله مجانًا</a>
<a class="b g" id="web" href="#">جرّب في المتصفح</a>
<div class="s" id="hint" hidden>ما فتح التطبيق؟ إن لم يكن عندك، حمّله من الزر أعلاه أو جرّب في المتصفح.</div>
<div class="s">تدريب مستقل غير تابع لأي جهة رسمية · عربي وإنجليزي</div>
</main>
<script>
var q=new URLSearchParams(location.search);
var ids=(q.get('q')||'').split('.').filter(function(x){return /^(phys|chem|bio|math)-u\d{2}-\d{3}$/.test(x)}).slice(0,12);
var s=Math.max(0,Math.min(ids.length||5,parseInt(q.get('s')||'0',10)||0));
var e=Math.max(0,Math.min(100,parseInt(q.get('e')||'0',10)||0));
var n=(q.get('n')||'').replace(/[<>&~|]/g,' ').trim().slice(0,20);
var names={phys:'فيزياء',chem:'كيمياء',bio:'أحياء',math:'رياضيات'};
if(ids.length>=3){
  document.getElementById('h').textContent=(n||'صديقك')+' يتحدّاك';
  var nq=ids.length<=10?ids.length+' أسئلة':ids.length+' سؤالًا';
  document.getElementById('p').innerHTML='نفس أسئلته: '+nq+'. أصاب '+s+' من '+ids.length+(e?' وتقديره '+e+' من 100':'')+'.<br>تقدر تتفوّق، وتعرف تقديرك أنت في التحصيلي؟ مع الشرح بعد كل سؤال.';
  var seen={};ids.forEach(function(id){var k=id.split('-')[0];if(!seen[k]){seen[k]=1;var e=document.createElement('span');e.textContent=names[k];document.getElementById('chips').appendChild(e);}});
}
var self=q.get('k')==='u';
if(self&&ids.length>=3){document.getElementById('h').textContent='اختبر نفسك في هذه الوحدة';document.getElementById('p').innerHTML=(ids.length<=10?ids.length+' أسئلة':ids.length+' سؤالًا')+' من وحدة واحدة، مع الشرح بعد كل سؤال.<br>بدون تسجيل، ومجانًا.';}
var qs='q='+encodeURIComponent(ids.join('.'))+'&s='+s+(e?'&e='+e:'')+(self?'&k=u':'')+(n?'&n='+encodeURIComponent(n):'');
var ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var store='https://apps.apple.com/sa/app/id6809119944';
var open=document.getElementById('open');open.href='arena99://tc?'+qs;
// 2.9.0: no automatic jump to the App Store any more. If the app did not open (the page is still in front
// after 3 s) we only say so and light up the store button; the visitor decides. Nothing ever navigates by itself.
function hint(){var h=document.getElementById('hint');if(h)h.hidden=false;var st=document.getElementById('store');st.style.borderColor='var(--teal)';st.style.color='var(--teal)';}
if(ios){open.addEventListener('click',function(){var t=Date.now();setTimeout(function(){if(Date.now()-t<5000&&!document.hidden&&document.hasFocus())hint();},3000);});}
else{open.hidden=true;}
document.getElementById('web').href=location.href.replace(/t\.html.*$/,'')+'app/?go=tc&'+qs;

// 2.9.0: three anonymous events into the same Supabase anon_events table the app uses (public publishable key,
// insert-only RLS). No name, no e-mail, no IP: a random id made in this browser, the kind of link, the platform.
var SB='https://amhperczhefponbuspyi.supabase.co',SBK='sb_publishable_xW4HFA9F9IZvp9H5PJNWOQ_sTjM9uzV';
function did(){try{var d=localStorage.getItem('a99.web.device');if(!d){d='w_'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('a99.web.device',d);}return d;}catch(x){return 'w_unknown';}}
function ev(name){
  try{
    fetch(SB+'/rest/v1/anon_events',{method:'POST',keepalive:true,headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({device:did(),kind:'ev',authed:false,platform:'web',ev:name,src:self?'selftest':(ids.length>=3?'dare':'direct'),props:{page:'t',ios:ios,n:ids.length}})}).catch(function(){});
  }catch(x){}
}
ev('t_dare_web_view');
document.getElementById('web').addEventListener('click',function(){ev('t_dare_web_play');});
document.getElementById('store').addEventListener('click',function(){ev('t_dare_web_store');});
</script>
</body></html>
