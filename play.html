<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ساحة 99 — تقدر تغلبني؟</title>
<meta name="description" content="صديقك يتحداك في 5 مسائل رياضيات — نفس الأسئلة، 60 ثانية لكل مسألة. العبها من المتصفح مباشرة، مجانًا وبدون تحميل، وشوف مين فاز في لوحة التحدي.">
<meta name="theme-color" content="#FBF7EF">
<!-- link previews (WhatsApp, Telegram, Snapchat, X, iMessage) — crawlers don't run JS, so these are static -->
<meta property="og:type" content="website">

<meta property="og:title" content="تقدر تغلبني؟ 5 مسائل، 60 ثانية لكل مسألة — ساحة 99">
<meta property="og:description" content="نفس الأسئلة الخمسة — العبها من المتصفح مباشرة، مجانًا وبدون تحميل، وشوف مين فاز في لوحة التحدي.">

<style>
:root{--bg:#FBF7EF;--panel:#FFFFFF;--line:#E7E0D2;--ink:#0F2A2E;--muted:#3F4A4C;--soft:#5B6466;--teal:#0F766E;--on:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#151413;--panel:#1E1C1A;--line:#363330;--ink:#EAE6DF;--muted:#C9C3B9;--soft:#A9A399;--teal:#5BBDAD;--on:#151413}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Cairo,'Geeza Pro',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
main{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
.logo b{font:800 26px ui-monospace,Menlo,monospace;color:#fff;background:#0F766E;border-radius:12px;padding:2px 10px}
h1{font-size:26px;line-height:1.4;margin:6px 0 0}
p{color:var(--muted);margin:0;line-height:1.7;font-size:15px}
.grid{display:inline-flex;gap:7px;direction:ltr;margin:2px 0}
.grid i{width:30px;height:30px;border-radius:8px;display:inline-block;position:relative}
.grid i.x{border:2px solid var(--line)}
.grid i.x:after{content:'×';position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font:900 15px system-ui;font-style:normal}
.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-weight:800;font-size:13px;color:var(--muted);text-align:start}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:800 16px Cairo,Tahoma,sans-serif;outline:none;text-align:center}
input:focus{border-color:var(--teal)}
.b{display:block;width:100%;background:var(--teal);color:var(--on);font-weight:900;font-size:18px;text-decoration:none;border:0;border-radius:14px;padding:15px;cursor:pointer;font-family:inherit}
.g{background:transparent;color:var(--teal);border:1px solid var(--line);font-size:15px;padding:12px}
.board{font-size:13px;color:var(--muted);font-weight:700}
.board b{color:var(--ink)}
.code{font-size:13px;color:var(--muted)}
.code b{font:800 17px ui-monospace,Menlo,monospace;letter-spacing:3px;color:var(--teal)}
.s{color:var(--soft);font-size:12px;margin-top:10px}
</style></head>
<body>
<main>
<div class="logo"><b>99</b>ساحة 99</div>
<h1 id="h">تقدر تغلبني؟</h1>
<div class="grid" id="grid" hidden></div>
<p id="p">5 مسائل رياضيات، 60 ثانية لكل مسألة.<br>مجانًا · بدون تسجيل</p>
<div class="board" id="board" hidden></div>
<div class="card" id="lobby" hidden>
  <label for="nick">اسمك في التحدي (اسم مستعار)</label>
  <input id="nick" maxlength="20" autocomplete="off" spellcheck="false">
  <a class="b" id="open" href="#">العب التحدي الآن</a>
</div>
<a class="b" id="open2" href="#" hidden></a>
<a class="b g" id="store" href="https://apps.apple.com/sa/app/id6809119944">ما عندك التطبيق؟ حمّله (مجاني)</a>
<div class="code" id="kc" hidden>عندك التطبيق؟ اكتب الكود في الرئيسية: <b id="kv"></b></div>
<div class="s" id="foot">تطبيق مستقل غير تابع لقياس</div>
</main>
<script>
var q=new URLSearchParams(location.search),c=q.get('c'),s=q.get('s')||'',r=q.get('r'),k=(q.get('k')||'').toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6),ref=(q.get('ref')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
if(k.length!==6)k='';
var kq=k?'&k='+k:'';
var android=/Android/i.test(navigator.userAgent),ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
var play='https://play.google.com/store/apps/details?id=com.alhassanmu.arena99';
// Google Play: flip to true the day the listing is PUBLIC (see appstore/ANDROID_BABY_STEPS.md, step J).
// Until then Android visitors play in the browser and see a «قريبًا» note instead of a dead store link.
var PLAY_LIVE=false;
var appStore='https://apps.apple.com/sa/app/id6809119944';
var web=location.href.replace(/play\.html.*$/,'')+'app/';
var androidFallback=PLAY_LIVE?play:web; // where intent:// goes when the app is not installed
// 2.3.2: the public Supabase endpoint (anon key — the same one the browser game ships; Row Level Security protects the data)
var SB='https://amhperczhefponbuspyi.supabase.co',SBK='sb_publishable_xW4HFA9F9IZvp9H5PJNWOQ_sTjM9uzV';
function $(id){return document.getElementById(id);}
function androidSoon(){$('store').hidden=true;$('foot').textContent='تطبيق أندرويد قريبًا على Google Play · تطبيق مستقل غير تابع لقياس';}
function ls(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;}}
function rpc(name,body){
  return fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(x){if(!x.ok)throw new Error(x.status);return x.json();});
}
// the same five grid tokens as the app: one teal fading with each hint, a miss outlined
function drawGrid(cells){var g=$('grid');g.innerHTML='';cells.forEach(function(lv){var i=document.createElement('i');if(lv<0)i.className='x';else i.style.background='rgba(15,118,110,'+[1,.65,.4,.22][lv]+')';g.appendChild(i);});g.hidden=false;}
// a friendly nickname: what this browser already uses in the game, else an Arabic noun + two digits
var NOUNS=['صقر','نجم','موجة','برق','قمر','نخلة','سهم','غيمة','جبل','نسر','شهاب','ريح','ليث','فهد','بحر','وادي','مدار','ضوء','كوكب','سحاب'];
function defaultNick(){var g=ls('arena99.game');var tag=g&&g.state&&g.state.profile&&g.state.profile.gamerTag;if(tag&&!/^محارب/.test(tag))return tag;return NOUNS[Math.floor(Math.random()*NOUNS.length)]+' '+String(10+Math.floor(Math.random()*90));}
function playedHere(key){
  var b=ls('arena99.boards'),ch=ls('arena99.challenges');
  var j=(b&&b.state&&b.state.joined)||[],m=(ch&&ch.state&&ch.state.mine)||[];
  return j.some(function(x){return x.k===key;})||m.some(function(x){return x.k===key&&x.shared;});
}
function deviceId(){try{return localStorage.getItem('arena99.device')||'d_web_lobby';}catch(e){return 'd_web_lobby';}}

function showChallenge(code){
  // v2 «60 ثانية» challenge: the friend plays the SAME 5 questions in the browser, no install.
  var name='صديقك',score=0,cells=[];
  try{
    var raw=decodeURIComponent(escape(atob(code.replace(/-/g,'+').replace(/_/g,'/'))));
    var parts=raw.split('~'),pts=[100,85,70,55];name=parts[1]||'صديقك';
    (parts[3]||'').split(',').forEach(function(m){var x=m.split(':'),cl=Math.min(3,+x[1]||0),ok=x[2]==='1';if(ok)score+=pts[cl];cells.push(ok?cl:-1);});
    $('h').textContent=name+' يتحداك · '+score;
    drawGrid(cells);
  }catch(e){$('h').textContent='تحدي 60 ثانية';}
  $('p').innerHTML='نفس الأسئلة الخمسة · 60 ثانية لكل مسألة<br>تلعبها من المتصفح مباشرة — بدون تحميل ولا تسجيل';
  var nick=$('nick');nick.value=defaultNick();
  $('lobby').hidden=false;
  var go=function(){var n=(nick.value||'').trim().slice(0,20);if(n.length<2)n=defaultNick();return web+'?go=round&r='+encodeURIComponent(code)+kq+'&n='+encodeURIComponent(n);};
  var o=$('open');o.href=go();
  nick.addEventListener('input',function(){o.href=go();});
  o.addEventListener('click',function(){o.href=go();});
  if(k){$('kv').textContent=k;$('kc').hidden=false;}
  var st=$('store');st.hidden=false;
  if(ios){st.textContent='عندي التطبيق — افتحه فيه';st.href='arena99://round?r='+encodeURIComponent(code)+kq;}
  else if(android){st.textContent='عندي التطبيق — افتحه فيه';st.href='intent://round?r='+encodeURIComponent(code)+kq+'#Intent;scheme=arena99;package=com.alhassanmu.arena99;S.browser_fallback_url='+encodeURIComponent(go())+';end';}
  else st.hidden=true;
  // who is already on the board (nicknames + scores only)
  if(k&&SB.indexOf('http')===0)rpc('challenge_summaries',{p_keys:[k],p_device:deviceId()}).then(function(rows){
    var x=rows&&rows[0];if(!x||!x.players||x.players<2)return;
    var b=$('board');var n=x.players,pw=n===2?'لاعبان':n<=10?n+' لاعبين':n+' لاعبًا';b.textContent='في لوحة التحدي: '+pw+' · الصدارة '+(x.leader||'')+' · '+x.leader_score;b.hidden=false;
  }).catch(function(){});
}

if(ref&&!r&&!k){
  // «ادعُ صديقًا»: a friend's invite code — shown big so it can be typed at sign-up
  $('h').textContent='صديقك دعاك إلى ساحة 99';
  var g0=$('grid');g0.textContent=ref;g0.style.font='900 26px ui-monospace,Menlo,monospace';g0.style.letterSpacing='8px';g0.hidden=false;
  $('p').innerHTML='اكتب كود الدعوة هذا عند إنشاء حسابك<br>رياضيات التحصيلي في جولات 60 ثانية — مجانًا';
  var o0=$('open2');o0.textContent='جرّب الآن من المتصفح';o0.href=web+'?ref='+ref;o0.hidden=false;
  var st0=$('store');if(android){if(PLAY_LIVE){st0.textContent='حمّل التطبيق من Google Play';st0.href=play;}else androidSoon();}else{st0.textContent='حمّل التطبيق من App Store';st0.href=ios?('arena99://invite?ref='+ref):appStore;}
  if(ios){st0.addEventListener('click',function(){setTimeout(function(){if(!document.hidden)location.href=appStore;},1400);});}
}else if(r){
  if(k&&playedHere(k))location.replace(web+'#/challenges/'+k);
  else showChallenge(r);
}else if(k){
  // 2.3.2 short link (…/c/?K7Q2MX → play.html?k=K7Q2MX): played here before → the board; else fetch the run behind the key
  if(playedHere(k))location.replace(web+'#/challenges/'+k);
  else{
    $('h').textContent='تحدي 60 ثانية';$('p').textContent='نجهّز التحدي…';$('store').hidden=true;
    rpc('challenge_get',{p_k:k}).then(function(code){
      if(typeof code==='string'&&code.length>10)showChallenge(code);
      else{$('h').textContent='ما لقينا هالكود';$('p').textContent='اطلب الرابط الكامل من صديقك، أو العب جولة جديدة.';var o3=$('open2');o3.textContent='العب جولة من المتصفح';o3.href=web;o3.hidden=false;$('store').hidden=false;}
    }).catch(function(){
      $('h').textContent='تعذّر فتح التحدي';$('p').textContent='تأكد من الاتصال وحاول مرة ثانية.';
      var o4=$('open2');o4.textContent='حاول مرة ثانية';o4.href=location.href;o4.hidden=false;
    });
  }
}else{
  // 1.5 duel links: try the app first; if it isn't installed the store opens after a moment.
  if(c){$('h').textContent=c+' يتحداك';}
  var deep='arena99://duel?'+(s?'s='+encodeURIComponent(s)+'&':'')+(c?'c='+encodeURIComponent(c):'');
  var store=android?play:appStore;
  $('store').href=store;
  var o5=$('open2');o5.textContent='افتح التحدي الآن';o5.hidden=false;
  if(android&&!PLAY_LIVE)androidSoon();
  // Android: intent:// opens the app if installed, otherwise Chrome follows the fallback (the browser game until Play is live)
  if(android){deep='intent://duel?'+(s?'s='+encodeURIComponent(s)+'&':'')+(c?'c='+encodeURIComponent(c):'')+'#Intent;scheme=arena99;package=com.alhassanmu.arena99;S.browser_fallback_url='+encodeURIComponent(androidFallback)+';end';}
  var go=function(){var t=Date.now();location.href=deep;if(android)return;setTimeout(function(){if(Date.now()-t<2000&&!document.hidden)location.href=store;},1400);};
  o5.addEventListener('click',function(e){e.preventDefault();go();});
  if(ios)setTimeout(go,400);
}
</script></body></html>
